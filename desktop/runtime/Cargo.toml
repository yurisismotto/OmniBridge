[package]
name = "pliwee-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
# The portable half of the OmniBridge Agent: `unsafe` is forbidden outright.
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[features]
default = ["upower"]
upower = ["pliwee-capability-battery/upower"]

[dependencies]
# The agent takes its storage adapter from whoever composes it, so it needs
# no filesystem implementation of its own. See `pliwee-linux`.
pliwee-core = { version = "1.0.0", path = "../core", default-features = false }
pliwee-proto = { version = "1.0.0", path = "../proto" }
pliwee-control = { version = "1.0.0", path = "../control" }
pliwee-capability-battery = { version = "1.0.0", path = "../capabilities/battery" }
pliwee-capability-clipboard = { version = "1.0.0", path = "../capabilities/clipboard" }
pliwee-capability-files = { version = "1.0.0", path = "../capabilities/files" }
pliwee-capability-notifications = { version = "1.0.0", path = "../capabilities/notifications" }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
mdns-sd = "0.15"
qrcode = { version = "0.14", default-features = false }
anyhow = "1"
